<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tréning mysle</title>
  <link rel="stylesheet" href="shared/brain.css?v=da2c3cdd">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #e6edf7 0%, #f6f8fb 100%);
      color: #1d2a3a;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 2rem; }
    a.back { color: #4a5b70; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 8px; }
    .sub { color: #4a5b70; margin: 6px 0 0; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: #4a5b70; margin: 26px 0 10px; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .game {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: #fff; border-radius: 16px; padding: 20px 14px;
      text-decoration: none; color: inherit;
      box-shadow: 0 2px 12px rgba(30, 50, 80, .08);
      transition: transform .1s;
    }
    .game:active { transform: translateY(2px); }
    .game .ico { font-size: 2.6rem; }
    .game .t { font-size: 1.1rem; font-weight: 600; text-align: center; }
    .game .d { font-size: .85rem; color: #5a6b80; text-align: center; }
    .game .b { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: .8rem; text-align: center; min-height: 1em; }
    .game .b .v { color: #8a99ac; font-size: .75rem; }
    .game .b .lead { color: #2f6fe0; font-weight: 600; overflow-wrap: anywhere; }
    .game .b .lead.me { color: #b8860b; }
    .game .b .mine { color: #5a6b80; }
    .daily {
      display: flex; align-items: center; gap: 16px; margin-top: 18px;
      background: #2f6fe0; color: #fff; border-radius: 16px; padding: 18px 20px;
      text-decoration: none; box-shadow: 0 4px 16px rgba(47, 111, 224, .3);
    }
    .daily .ico { font-size: 2.6rem; }
    .daily .t { font-size: 1.25rem; font-weight: 700; }
    .daily .d { opacity: .9; font-size: .95rem; }
    .daily .streak { margin-left: auto; text-align: center; font-size: .85rem; }
    .daily .streak b { display: block; font-size: 1.6rem; }
    .langsw { display: flex; gap: 4px; margin-left: auto; }
    .langsw button {
      font-size: .85rem; font-weight: 700; padding: 5px 9px; border: 0; border-radius: 8px;
      background: rgba(255,255,255,.85); color: #4a5b70; box-shadow: 0 2px 0 #c3cfdf; min-width: 38px; cursor: pointer;
      font-family: inherit;
    }
    .langsw button.active { background: #2f6fe0; color: #fff; box-shadow: 0 2px 0 #1d4ea8; }
  </style>
</head>
<body class="brain">
  <div class="wrap">
    <a class="back" href="/" id="back" hidden>← Rozcestník</a>
    <header><h1 id="title">🧠 Tréning mysle</h1></header>
    <p class="sub" id="sub"></p>
    <a class="daily" href="trening/">
      <span class="ico">🔥</span>
      <span><span class="t" id="dailyT"></span><br><span class="d" id="dailyD"></span></span>
      <span class="streak" id="streak"></span>
    </a>
    <h2 id="hMath">Matematika</h2>
    <div class="games" id="math"></div>
    <h2 id="hFocus">Presnosť a sústredenie</h2>
    <div class="games" id="focus"></div>
    <h2 id="hMind">Pamäť a pozornosť</h2>
    <div class="games" id="mind"></div>
  </div>

  <script src="shared/i18n.js?v=a99f3957"></script>
  <script src="shared/brain.js?v=6ed49c12"></script>
  <script>
    // vars = varianty hry (kľúče tabuliek) od najľahšieho po najťažší, l = popis variantu;
    // lower = menej je lepšie (čas), fmt = zobrazenie výsledku, random = varianty bez poradia
    const L = Brain.L;
    const V = (prefix, list) => list.map(([v, l]) => ({ k: prefix + v, l }));
    const LVL = [["easy", L("ľahké", "lehké", "easy")], ["mid", L("stredné", "střední", "medium")], ["hard", L("ťažké", "těžké", "hard")]];
    const OPS = [["add", "+"], ["sub", "−"], ["mul", "×"], ["div", "÷"], ["mix", "Mix"]];
    const RETAZ = [];
    for (const [d, dl] of [["easy", L("do 50", "do 50", "to 50")], ["mid", L("do 100", "do 100", "to 100")], ["hard", L("do 300", "do 300", "to 300")]])
      for (const [sp, sl] of [["slow", L("pomaly", "pomalu", "slow")], ["mid", L("stredne", "středně", "medium")], ["fast", L("rýchlo", "rychle", "fast")]])
        RETAZ.push([`${d}.${sp}`, { sk: `${dl.sk} · ${sl.sk}`, cs: `${dl.cs} · ${sl.cs}`, en: `${dl.en} · ${sl.en}` }]);
    const TRIKY = [["x11", "× 11"], ["x5", "× 5"], ["x9", "× 9"], ["x25", "× 25"], ["sq5", L("Mocnina …5", "Mocnina …5", "Squares of …5")],
      ["half", L("Polovica × dvojnásobok", "Polovina × dvojnásobek", "Halve & double")], ["round", L("Zaokrúhli a oprav", "Zaokrouhli a oprav", "Round & fix")],
      ["k1000", L("1000 − číslo", "1000 − číslo", "1000 − number")], ["pct", L("Percentá cez 10 %", "Procenta přes 10 %", "Percent via 10%")],
      ["near100", L("Čísla blízko 100", "Čísla blízko 100", "Near 100")], ["mix", L("Mix všetkých", "Mix všech", "Mix of all")]];
    const SIZES = list => list.map(n => [n, `${n}×${n}`]);
    const pct = s => Brain.num(s) + " %";
    const GAMES = {
      math: [
        { href: "rychle/", ico: "⚡", vars: V("rychle.", OPS),
          t: { sk: "Rýchle počty", cs: "Rychlé počty", en: "Speed arithmetic" },
          d: { sk: "60 sekúnd, +−×÷, obtiažnosť sa prispôsobí", cs: "60 sekund, +−×÷, obtížnost se přizpůsobí", en: "60 seconds, +−×÷, adaptive difficulty" } },
        { href: "retaz/", ico: "🔗", vars: V("retaz.", RETAZ),
          t: { sk: "Reťazové počty", cs: "Řetězové počty", en: "Chain arithmetic" },
          d: { sk: "Počítaj v hlave krok za krokom", cs: "Počítej v hlavě krok za krokem", en: "Keep a running total in your head" } },
        { href: "odhad/", ico: "🎯", vars: V("odhad.", [["calc", L("počty", "počty", "calculations")], ["life", L("zo života", "ze života", "everyday")], ["all", L("všetko", "vše", "all")]]),
          t: { sk: "Odhad", cs: "Odhad", en: "Estimation" },
          d: { sk: "Približne a rýchlo: súčiny, percentá, kurz", cs: "Přibližně a rychle: součiny, procenta, kurz", en: "Quick and close: products, percentages, FX" } },
        { href: "ciel/", ico: "🏁", vars: V("ciel.", LVL),
          t: { sk: "Dosiahni cieľ", cs: "Dosáhni cíle", en: "Hit the target" },
          d: { sk: "Z daných čísel poskladaj cieľové číslo", cs: "Z daných čísel slož cílové číslo", en: "Combine the numbers to reach the target" } },
        { href: "triky/", ico: "🪄", vars: V("triky.", TRIKY), random: true, fmt: s => s + "/10",
          t: { sk: "Triky z hlavy", cs: "Triky z hlavy", en: "Mental math tricks" },
          d: { sk: "×11, ×5, ×25, mocniny, percentá…", cs: "×11, ×5, ×25, mocniny, procenta…", en: "×11, ×5, ×25, squares, percentages…" } },
        { href: "nasobilka/", ico: "✖️", vars: V("nasobilka.", [10, 12, 15, 20].map(n => [n, L(`do ${n}`, `do ${n}`, `to ${n}`)])), fmt: Brain.okTime(20).fmt,
          t: { sk: "Násobilka do 20", cs: "Násobilka do 20", en: "Times tables to 20" },
          d: { sk: "Opakuje častejšie to, čo nevieš", cs: "Opakuje častěji to, co nevíš", en: "Repeats what you miss more often" } },
        { href: "percenta/", ico: "％", vars: [{ k: "percenta" }], fmt: s => s + "/10",
          t: { sk: "Percentá a úroky", cs: "Procenta a úroky", en: "Percentages & interest" },
          d: { sk: "Zľavy, DPH, zmena v %, zložené úročenie", cs: "Slevy, DPH, změna v %, složené úročení", en: "Discounts, VAT, % change, compounding" } },
      ],
      focus: [
        { href: "sart/", ico: "🛑", vars: V("sart.", [["short", L("krátka", "krátká", "short")], ["full", L("plná", "plná", "full")]]), fmt: pct,
          t: { sk: "Nestlač trojku", cs: "Nemačkej trojku", en: "Don't press 3" },
          d: { sk: "Stláčaj stále, len pri 3 nie – chyby z autopilota", cs: "Mačkej pořád, jen u 3 ne – chyby z autopilota", en: "Press for every digit except 3 – autopilot errors" } },
        { href: "kontrolor/", ico: "🔍", vars: V("kontrolor.", LVL), fmt: pct,
          t: { sk: "Kontrolór", cs: "Kontrolor", en: "Checker" },
          d: { sk: "Nájdi chyby v hotových výpočtoch", cs: "Najdi chyby v hotových výpočtech", en: "Spot mistakes in worked problems" } },
        { href: "rychle/", ico: "🎯", vars: V("rychle.acc.", OPS), preset: "acc",
          t: { sk: "Rýchle počty: presnosť", cs: "Rychlé počty: přesnost", en: "Arithmetic: accuracy" },
          d: { sk: "Bez času, prvá chyba končí – najdlhšia séria", cs: "Bez času, první chyba končí – nejdelší série", en: "No clock, first mistake ends it – longest streak" } },
      ],
      mind: [
        { href: "nback/", ico: "🔲", vars: V("nback.", [["single", L("pozícia", "pozice", "position")], ["dual", L("pozícia + písmeno", "pozice + písmeno", "position + letter")]]), fmt: s => "N = " + s,
          t: { sk: "N-back", cs: "N-back", en: "N-back" },
          d: { sk: "Pracovná pamäť: bolo to pred N krokmi?", cs: "Pracovní paměť: bylo to před N kroky?", en: "Working memory: was it N steps ago?" } },
        { href: "cisla/", ico: "🔢", vars: V("cisla.", [["fwd", L("dopredu", "dopředu", "forwards")], ["bwd", L("odzadu", "pozpátku", "backwards")]]),
          t: { sk: "Pamäť čísel", cs: "Paměť čísel", en: "Digit span" },
          d: { sk: "Zapamätaj si rad číslic (aj odzadu)", cs: "Zapamatuj si řadu číslic (i pozpátku)", en: "Remember the digits (also backwards)" } },
        { href: "schulte/", ico: "👁️", vars: V("schulte.", SIZES([3, 4, 5, 6])), lower: true, fmt: Brain.secs,
          t: { sk: "Schulteho tabuľka", cs: "Schulteho tabulka", en: "Schulte table" },
          d: { sk: "Nájdi čísla po poradí čo najrýchlejšie", cs: "Najdi čísla popořadě co nejrychleji", en: "Find the numbers in order, fast" } },
        { href: "stroop/", ico: "🎨", vars: V("stroop.", [["ink", L("farba písma", "barva písma", "ink colour")], ["switch", L("prepínanie", "přepínání", "switching")]]),
          t: { sk: "Stroop", cs: "Stroop", en: "Stroop" },
          d: { sk: "Farba písma, nie slovo", cs: "Barva písma, ne slovo", en: "The ink colour, not the word" } },
        { href: "kalkudoku/", ico: "🧮", vars: V("kalkudoku.", SIZES([4, 5, 6])), lower: true, fmt: Brain.secs,
          t: { sk: "Kalkudoku", cs: "Kalkudoku", en: "Calcudoku" },
          d: { sk: "Sudoku so súčtami a súčinmi", cs: "Sudoku se součty a součiny", en: "Sudoku with sums and products" } },
      ],
    };

    const PAGE = {
      title: { sk: "🧠 Tréning mysle", cs: "🧠 Trénink mysli", en: "🧠 Brain training" },
      docTitle: { sk: "Tréning mysle", cs: "Trénink mysli", en: "Brain training" },
      sub: { sk: "Krátke hry na počty z hlavy, pamäť a pozornosť. Výsledky sa ukladajú v tomto prehliadači.",
             cs: "Krátké hry na počty z hlavy, paměť a pozornost. Výsledky se ukládají v tomto prohlížeči.",
             en: "Short games for mental math, memory and attention. Results are stored in this browser." },
      dailyT: { sk: "Denný tréning", cs: "Denní trénink", en: "Daily workout" },
      dailyD: { sk: "3 hry, asi 5 minút – každý deň iný mix", cs: "3 hry, asi 5 minut – každý den jiný mix", en: "3 games, about 5 minutes – a new mix every day" },
      days: { sk: "dní v rade", cs: "dní v řadě", en: "day streak" },
      subCloud: { sk: "Krátke hry na počty z hlavy, pamäť a pozornosť. Tabuľka najlepších je spoločná pre všetkých hráčov.",
                  cs: "Krátké hry na počty z hlavy, paměť a pozornost. Tabulka nejlepších je společná pro všechny hráče.",
                  en: "Short games for mental math, memory and attention. The leaderboard is shared by all players." },
      place: { sk: r => `Ty: ${r}. miesto`, cs: r => `Ty: ${r}. místo`, en: r => `You: #${r}` },
      math: { sk: "Matematika", cs: "Matematika", en: "Maths" },
      mind: { sk: "Pamäť a pozornosť", cs: "Paměť a pozornost", en: "Memory & attention" },
      focus: { sk: "Presnosť a sústredenie", cs: "Přesnost a soustředění", en: "Accuracy & focus" },
    };

    // Počet dní v rade so splneným denným tréningom (dnešok sa ráta, keď je hotový).
    function streak() {
      const done = Brain.load("dailyDone", {});
      const d = new Date();
      if (!done[Brain.today(d)]) d.setDate(d.getDate() - 1);
      let n = 0;
      while (done[Brain.today(d)]) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }

    document.title = t(PAGE.docTitle);
    document.getElementById("title").textContent = t(PAGE.title);
    document.getElementById("sub").textContent = t(Brain.cloudOn() ? PAGE.subCloud : PAGE.sub);
    document.getElementById("dailyT").textContent = t(PAGE.dailyT);
    document.getElementById("dailyD").textContent = t(PAGE.dailyD);
    document.getElementById("hMath").textContent = t(PAGE.math);
    document.getElementById("hMind").textContent = t(PAGE.mind);
    document.getElementById("hFocus").textContent = t(PAGE.focus);
    document.getElementById("streak").innerHTML = `<b>${streak()}</b>${t(PAGE.days)}`;

    // Ktorý variant ukázať na karte: kde som prvý → najťažší taký (pri hrách bez poradia
    // náročnosti náhodný, počas návštevy stránky stále ten istý); inak variant s mojou
    // najlepšou priečkou (pri zhode ťažší); keď som hru nehral → najhranejší variant.
    const randomPick = new Map();
    function pick(g, boards, me) {
      const rows = g.vars.map(v => {
        const lb = boards[v.k] || {};
        const all = Object.entries(lb).sort((a, b) => (g.lower ? a[1] - b[1] : b[1] - a[1]));
        const place = me in lb ? 1 + all.filter(([, s]) => (g.lower ? s < lb[me] : s > lb[me])).length : null;
        return { v, all, place, my: lb[me] };
      }).filter(r => r.all.length);
      if (!rows.length) return null;
      const first = rows.filter(r => r.place === 1);
      if (first.length) {
        if (!g.random) return first[first.length - 1];
        const keep = first.find(r => r.v.k === randomPick.get(g));
        const r = keep || Brain.pick(first);
        randomPick.set(g, r.v.k);
        return r;
      }
      const played = rows.filter(r => r.place !== null);
      if (played.length) return played.reduce((a, b) => (b.place <= a.place ? b : a));
      return rows.reduce((a, b) => (b.all.length >= a.all.length ? b : a));
    }
    // Variant, líder (🥇) a pod ním moja priečka, keď nie som prvý.
    function stats(g, boards) {
      const me = Brain.user(), r = pick(g, boards, me), fmt = g.fmt || Brain.num;
      if (!r) return "";
      const [ln, ls] = r.place === 1 ? [me, r.my] : r.all[0];
      return (r.v.l ? `<span class="v">${Brain.esc(t(r.v.l))}</span>` : "") +
        `<span class="lead${ln === me ? " me" : ""}">🥇 ${Brain.esc(ln)} · ${fmt(ls)}</span>` +
        (r.place > 1 ? `<span class="mine">${t(PAGE.place)(r.place)} · ${fmt(r.my)}</span>` : "");
    }

    const cards = [];
    for (const [section, list] of Object.entries(GAMES)) {
      const box = document.getElementById(section);
      for (const g of list) {
        const a = document.createElement("a");
        a.className = "game";
        a.href = g.href;
        // karta s predvoleným režimom (presnosť v Rýchlych počtoch) ho pred otvorením nastaví
        if (g.preset) a.addEventListener("click", () => Brain.save("opt.rychle.style", g.preset));
        else if (g.href === "rychle/") a.addEventListener("click", () => Brain.save("opt.rychle.style", "speed"));
        a.innerHTML = `<span class="ico">${g.ico}</span>` +
          `<span class="t">${t(g.t)}</span><span class="d">${t(g.d)}</span><span class="b"></span>`;
        box.appendChild(a);
        cards.push([g, a.querySelector(".b")]);
      }
    }
    // najprv údaje z tohto zariadenia, potom spoločná tabuľka zo servera
    const spec = {};
    for (const [g] of cards) for (const v of g.vars) spec[v.k] = !!g.lower;
    const show = boards => { for (const [g, el] of cards) el.innerHTML = stats(g, boards); };
    Brain.allBoards(spec, { online: false }).then(show);
    if (Brain.cloudOn()) Brain.allBoards(spec).then(show, () => {});

    // Odkaz na domáci rozcestník len na lokálnom serveri.
    if (location.hostname === "localhost" || /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)) {
      document.getElementById("back").hidden = false;
    }

    // meno hráča je povinné; rekordy a séria na kartách sú jeho
    Brain.ensureUser(document.querySelector("header"));
    I18N.attach();
  </script>
</body>
</html>
