<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tréning mysle</title>
  <link rel="stylesheet" href="shared/brain.css?v=da2c3cdd">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #e6edf7 0%, #f6f8fb 100%);
      color: #1d2a3a;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
    header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 2rem; }
    a.back { color: #4a5b70; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 8px; }
    .sub { color: #4a5b70; margin: 6px 0 0; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .06em; color: #4a5b70; margin: 26px 0 10px; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .game {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: #fff; border-radius: 16px; padding: 20px 14px;
      text-decoration: none; color: inherit;
      box-shadow: 0 2px 12px rgba(30, 50, 80, .08);
      transition: transform .1s;
    }
    .game:active { transform: translateY(2px); }
    .game .ico { font-size: 2.6rem; }
    .game .t { font-size: 1.1rem; font-weight: 600; text-align: center; }
    .game .d { font-size: .85rem; color: #5a6b80; text-align: center; }
    .game .b { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: .8rem; text-align: center; min-height: 1em; }
    .game .b .v { color: #8a99ac; font-size: .75rem; }
    .game .b .lead { color: #2f6fe0; font-weight: 600; overflow-wrap: anywhere; }
    .game .b .lead.me { color: #b8860b; }
    .game .b .mine { color: #5a6b80; }
    .daily {
      display: flex; align-items: center; gap: 16px; margin-top: 18px;
      background: #2f6fe0; color: #fff; border-radius: 16px; padding: 18px 20px;
      text-decoration: none; box-shadow: 0 4px 16px rgba(47, 111, 224, .3);
    }
    .daily .ico { font-size: 2.6rem; }
    .daily .t { font-size: 1.25rem; font-weight: 700; }
    .daily .d { opacity: .9; font-size: .95rem; }
    .daily .streak { margin-left: auto; text-align: center; font-size: .85rem; }
    .daily .streak b { display: block; font-size: 1.6rem; }
    .langsw { display: flex; gap: 4px; margin-left: auto; }
    .langsw button {
      font-size: .85rem; font-weight: 700; padding: 5px 9px; border: 0; border-radius: 8px;
      background: rgba(255,255,255,.85); color: #4a5b70; box-shadow: 0 2px 0 #c3cfdf; min-width: 38px; cursor: pointer;
      font-family: inherit;
    }
    .langsw button.active { background: #2f6fe0; color: #fff; box-shadow: 0 2px 0 #1d4ea8; }
  </style>
</head>
<body class="brain">
  <div class="wrap">
    <a class="back" href="/" id="back" hidden>← Rozcestník</a>
    <header><h1 id="title">🧠 Tréning mysle</h1></header>
    <p class="sub" id="sub"></p>
    <a class="daily" href="trening/">
      <span class="ico">🔥</span>
      <span><span class="t" id="dailyT"></span><br><span class="d" id="dailyD"></span></span>
      <span class="streak" id="streak"></span>
    </a>
    <h2 id="hMath">Matematika</h2>
    <div class="games" id="math"></div>
    <h2 id="hFocus">Presnosť a sústredenie</h2>
    <div class="games" id="focus"></div>
    <h2 id="hMind">Pamäť a pozornosť</h2>
    <div class="games" id="mind"></div>
  </div>

  <script src="shared/i18n.js?v=c5d3d07f"></script>
  <script src="shared/brain.js?v=9fdd7462"></script>
  <script>
    // Hra: variants = varianty (kľúče tabuliek) od najľahšieho po najťažší, label = popis variantu;
    // lower = menej je lepšie (čas), format = zobrazenie výsledku, random = varianty bez poradia náročnosti
    const localized = Brain.localized;
    const variants = (keyPrefix, options) => options.map(([value, label]) => ({ key: keyPrefix + value, label }));
    const LEVELS = [["easy", localized("ľahké", "lehké", "easy")], ["mid", localized("stredné", "střední", "medium")], ["hard", localized("ťažké", "těžké", "hard")]];
    const OPERATIONS = [["add", "+"], ["sub", "−"], ["mul", "×"], ["div", "÷"], ["mix", "Mix"]];
    const CHAIN_RANGES = [["easy", localized("do 50", "do 50", "to 50")], ["mid", localized("do 100", "do 100", "to 100")], ["hard", localized("do 300", "do 300", "to 300")]];
    const CHAIN_PACES = [["slow", localized("pomaly", "pomalu", "slow")], ["mid", localized("stredne", "středně", "medium")], ["fast", localized("rýchlo", "rychle", "fast")]];
    const joinLabels = (a, b) => ({ sk: `${a.sk} · ${b.sk}`, cs: `${a.cs} · ${b.cs}`, en: `${a.en} · ${b.en}` });
    const CHAIN_OPTIONS = CHAIN_RANGES.flatMap(([range, rangeLabel]) =>
      CHAIN_PACES.map(([pace, paceLabel]) => [`${range}.${pace}`, joinLabels(rangeLabel, paceLabel)]));
    const TRICKS = [["x11", "× 11"], ["x5", "× 5"], ["x9", "× 9"], ["x25", "× 25"], ["sq5", localized("Mocnina …5", "Mocnina …5", "Squares of …5")],
      ["half", localized("Polovica × dvojnásobok", "Polovina × dvojnásobek", "Halve & double")], ["round", localized("Zaokrúhli a oprav", "Zaokrouhli a oprav", "Round & fix")],
      ["k1000", localized("1000 − číslo", "1000 − číslo", "1000 − number")], ["pct", localized("Percentá cez 10 %", "Procenta přes 10 %", "Percent via 10%")],
      ["near100", localized("Čísla blízko 100", "Čísla blízko 100", "Near 100")], ["mix", localized("Mix všetkých", "Mix všech", "Mix of all")]];
    const gridSizes = sizes => sizes.map(n => [n, `${n}×${n}`]);
    const formatPercent = score => Brain.formatNumber(score) + " %";
    const GAMES = {
      math: [
        { href: "rychle/", icon: "⚡", variants: variants("rychle.", OPERATIONS),
          title: { sk: "Rýchle počty", cs: "Rychlé počty", en: "Speed arithmetic" },
          description: { sk: "60 sekúnd, +−×÷, obtiažnosť sa prispôsobí", cs: "60 sekund, +−×÷, obtížnost se přizpůsobí", en: "60 seconds, +−×÷, adaptive difficulty" } },
        { href: "retaz/", icon: "🔗", variants: variants("retaz.", CHAIN_OPTIONS),
          title: { sk: "Reťazové počty", cs: "Řetězové počty", en: "Chain arithmetic" },
          description: { sk: "Počítaj v hlave krok za krokom", cs: "Počítej v hlavě krok za krokem", en: "Keep a running total in your head" } },
        { href: "odhad/", icon: "🎯", variants: variants("odhad.", [["calc", localized("počty", "počty", "calculations")], ["life", localized("zo života", "ze života", "everyday")], ["all", localized("všetko", "vše", "all")]]),
          title: { sk: "Odhad", cs: "Odhad", en: "Estimation" },
          description: { sk: "Približne a rýchlo: súčiny, percentá, kurz", cs: "Přibližně a rychle: součiny, procenta, kurz", en: "Quick and close: products, percentages, FX" } },
        { href: "ciel/", icon: "🏁", variants: variants("ciel.", LEVELS),
          title: { sk: "Dosiahni cieľ", cs: "Dosáhni cíle", en: "Hit the target" },
          description: { sk: "Z daných čísel poskladaj cieľové číslo", cs: "Z daných čísel slož cílové číslo", en: "Combine the numbers to reach the target" } },
        { href: "triky/", icon: "🪄", variants: variants("triky.", TRICKS), random: true, format: correct => correct + "/10",
          title: { sk: "Triky z hlavy", cs: "Triky z hlavy", en: "Mental math tricks" },
          description: { sk: "×11, ×5, ×25, mocniny, percentá…", cs: "×11, ×5, ×25, mocniny, procenta…", en: "×11, ×5, ×25, squares, percentages…" } },
        { href: "nasobilka/", icon: "✖️", variants: variants("nasobilka.", [10, 12, 15, 20].map(n => [n, localized(`do ${n}`, `do ${n}`, `to ${n}`)])), format: Brain.scoreWithTime(20).format,
          title: { sk: "Násobilka do 20", cs: "Násobilka do 20", en: "Times tables to 20" },
          description: { sk: "Opakuje častejšie to, čo nevieš", cs: "Opakuje častěji to, co nevíš", en: "Repeats what you miss more often" } },
        { href: "percenta/", icon: "％", variants: [{ key: "percenta" }], format: correct => correct + "/10",
          title: { sk: "Percentá a úroky", cs: "Procenta a úroky", en: "Percentages & interest" },
          description: { sk: "Zľavy, DPH, zmena v %, zložené úročenie", cs: "Slevy, DPH, změna v %, složené úročení", en: "Discounts, VAT, % change, compounding" } },
      ],
      focus: [
        { href: "sart/", icon: "🛑", variants: variants("sart.", [["short", localized("krátka", "krátká", "short")], ["full", localized("plná", "plná", "full")]]), format: formatPercent,
          title: { sk: "Nestlač trojku", cs: "Nemačkej trojku", en: "Don't press 3" },
          description: { sk: "Stláčaj stále, len pri 3 nie – chyby z autopilota", cs: "Mačkej pořád, jen u 3 ne – chyby z autopilota", en: "Press for every digit except 3 – autopilot errors" } },
        { href: "kontrolor/", icon: "🔍", variants: variants("kontrolor.", LEVELS), format: formatPercent,
          title: { sk: "Kontrolór", cs: "Kontrolor", en: "Checker" },
          description: { sk: "Nájdi chyby v hotových výpočtoch", cs: "Najdi chyby v hotových výpočtech", en: "Spot mistakes in worked problems" } },
        { href: "rychle/", icon: "🎯", variants: variants("rychle.acc.", OPERATIONS), preset: "acc",
          title: { sk: "Rýchle počty: presnosť", cs: "Rychlé počty: přesnost", en: "Arithmetic: accuracy" },
          description: { sk: "Bez času, prvá chyba končí – najdlhšia séria", cs: "Bez času, první chyba končí – nejdelší série", en: "No clock, first mistake ends it – longest streak" } },
      ],
      mind: [
        { href: "nback/", icon: "🔲", variants: variants("nback.", [["single", localized("pozícia", "pozice", "position")], ["dual", localized("pozícia + písmeno", "pozice + písmeno", "position + letter")]]), format: level => "N = " + level,
          title: { sk: "N-back", cs: "N-back", en: "N-back" },
          description: { sk: "Pracovná pamäť: bolo to pred N krokmi?", cs: "Pracovní paměť: bylo to před N kroky?", en: "Working memory: was it N steps ago?" } },
        { href: "cisla/", icon: "🔢", variants: variants("cisla.", [["fwd", localized("dopredu", "dopředu", "forwards")], ["bwd", localized("odzadu", "pozpátku", "backwards")]]),
          title: { sk: "Pamäť čísel", cs: "Paměť čísel", en: "Digit span" },
          description: { sk: "Zapamätaj si rad číslic (aj odzadu)", cs: "Zapamatuj si řadu číslic (i pozpátku)", en: "Remember the digits (also backwards)" } },
        { href: "schulte/", icon: "👁️", variants: variants("schulte.", gridSizes([3, 4, 5, 6])), lower: true, format: Brain.formatSeconds,
          title: { sk: "Schulteho tabuľka", cs: "Schulteho tabulka", en: "Schulte table" },
          description: { sk: "Nájdi čísla po poradí čo najrýchlejšie", cs: "Najdi čísla popořadě co nejrychleji", en: "Find the numbers in order, fast" } },
        { href: "stroop/", icon: "🎨", variants: variants("stroop.", [["ink", localized("farba písma", "barva písma", "ink colour")], ["switch", localized("prepínanie", "přepínání", "switching")]]),
          title: { sk: "Stroop", cs: "Stroop", en: "Stroop" },
          description: { sk: "Farba písma, nie slovo", cs: "Barva písma, ne slovo", en: "The ink colour, not the word" } },
        { href: "kalkudoku/", icon: "🧮", variants: variants("kalkudoku.", gridSizes([4, 5, 6])), lower: true, format: Brain.formatSeconds,
          title: { sk: "Kalkudoku", cs: "Kalkudoku", en: "Calcudoku" },
          description: { sk: "Sudoku so súčtami a súčinmi", cs: "Sudoku se součty a součiny", en: "Sudoku with sums and products" } },
      ],
    };

    const PAGE = {
      title: { sk: "🧠 Tréning mysle", cs: "🧠 Trénink mysli", en: "🧠 Brain training" },
      docTitle: { sk: "Tréning mysle", cs: "Trénink mysli", en: "Brain training" },
      sub: { sk: "Krátke hry na počty z hlavy, pamäť a pozornosť. Výsledky sa ukladajú v tomto prehliadači.",
             cs: "Krátké hry na počty z hlavy, paměť a pozornost. Výsledky se ukládají v tomto prohlížeči.",
             en: "Short games for mental math, memory and attention. Results are stored in this browser." },
      dailyT: { sk: "Denný tréning", cs: "Denní trénink", en: "Daily workout" },
      dailyD: { sk: "3 hry, asi 5 minút – každý deň iný mix", cs: "3 hry, asi 5 minut – každý den jiný mix", en: "3 games, about 5 minutes – a new mix every day" },
      days: { sk: "dní v rade", cs: "dní v řadě", en: "day streak" },
      subCloud: { sk: "Krátke hry na počty z hlavy, pamäť a pozornosť. Tabuľka najlepších je spoločná pre všetkých hráčov.",
                  cs: "Krátké hry na počty z hlavy, paměť a pozornost. Tabulka nejlepších je společná pro všechny hráče.",
                  en: "Short games for mental math, memory and attention. The leaderboard is shared by all players." },
      place: { sk: r => `Ty: ${r}. miesto`, cs: r => `Ty: ${r}. místo`, en: r => `You: #${r}` },
      math: { sk: "Matematika", cs: "Matematika", en: "Maths" },
      mind: { sk: "Pamäť a pozornosť", cs: "Paměť a pozornost", en: "Memory & attention" },
      focus: { sk: "Presnosť a sústredenie", cs: "Přesnost a soustředění", en: "Accuracy & focus" },
    };

    // Počet dní v rade so splneným denným tréningom (dnešok sa ráta, keď je hotový).
    function streak() {
      const done = Brain.loadPlayer("dailyDone", {});
      const d = new Date();
      if (!done[Brain.today(d)]) d.setDate(d.getDate() - 1);
      let n = 0;
      while (done[Brain.today(d)]) { n++; d.setDate(d.getDate() - 1); }
      return n;
    }

    document.title = translate(PAGE.docTitle);
    document.getElementById("title").textContent = translate(PAGE.title);
    document.getElementById("sub").textContent = translate(Brain.cloudOn() ? PAGE.subCloud : PAGE.sub);
    document.getElementById("dailyT").textContent = translate(PAGE.dailyT);
    document.getElementById("dailyD").textContent = translate(PAGE.dailyD);
    document.getElementById("hMath").textContent = translate(PAGE.math);
    document.getElementById("hMind").textContent = translate(PAGE.mind);
    document.getElementById("hFocus").textContent = translate(PAGE.focus);
    document.getElementById("streak").innerHTML = `<b>${streak()}</b>${translate(PAGE.days)}`;

    // Výsledky hráča vo variante: zoradená tabuľka, moja priečka (null = nehral) a môj výsledok.
    function variantStanding(game, variant, boards, player) {
      const scores = boards[variant.key] || {};
      const ranking = Object.entries(scores).sort((a, b) => (game.lower ? a[1] - b[1] : b[1] - a[1]));
      const isBetter = score => (game.lower ? score < scores[player] : score > scores[player]);
      const place = player in scores ? 1 + ranking.filter(([, score]) => isBetter(score)).length : null;
      return { variant, ranking, place, myScore: scores[player] };
    }
    // Ktorý variant ukázať na karte: kde som prvý → najťažší taký (pri hrách bez poradia
    // náročnosti náhodný, počas návštevy stránky stále ten istý); inak variant s mojou
    // najlepšou priečkou (pri zhode ťažší); keď som hru nehral → najhranejší variant.
    const randomChoice = new Map();
    function chooseVariant(game, boards, player) {
      const played = game.variants.map(variant => variantStanding(game, variant, boards, player)).filter(s => s.ranking.length);
      if (!played.length) return null;
      const leading = played.filter(s => s.place === 1);
      if (leading.length) {
        if (!game.random) return leading[leading.length - 1];
        const chosen = leading.find(s => s.variant.key === randomChoice.get(game)) || Brain.pick(leading);
        randomChoice.set(game, chosen.variant.key);
        return chosen;
      }
      const mine = played.filter(s => s.place !== null);
      if (mine.length) return mine.reduce((best, s) => (s.place <= best.place ? s : best));
      return played.reduce((most, s) => (s.ranking.length >= most.ranking.length ? s : most));
    }
    // Variant, líder (🥇) a pod ním moja priečka, keď nie som prvý.
    function cardStatsHtml(game, boards) {
      const player = Brain.user(), standing = chooseVariant(game, boards, player);
      if (!standing) return "";
      const format = game.format || Brain.formatNumber;
      const [leader, leaderScore] = standing.place === 1 ? [player, standing.myScore] : standing.ranking[0];
      const label = standing.variant.label ? `<span class="v">${Brain.escapeHtml(translate(standing.variant.label))}</span>` : "";
      const leaderLine = `<span class="lead${leader === player ? " me" : ""}">🥇 ${Brain.escapeHtml(leader)} · ${format(leaderScore)}</span>`;
      const myLine = standing.place > 1 ? `<span class="mine">${translate(PAGE.place)(standing.place)} · ${format(standing.myScore)}</span>` : "";
      return label + leaderLine + myLine;
    }

    const cards = [];
    for (const [section, games] of Object.entries(GAMES)) {
      const box = document.getElementById(section);
      for (const game of games) {
        const card = document.createElement("a");
        card.className = "game";
        card.href = game.href;
        // karta s predvoleným režimom (presnosť v Rýchlych počtoch) ho pred otvorením nastaví
        if (game.preset) card.addEventListener("click", () => Brain.savePlayer("opt.rychle.style", game.preset));
        else if (game.href === "rychle/") card.addEventListener("click", () => Brain.savePlayer("opt.rychle.style", "speed"));
        card.innerHTML = `<span class="ico">${game.icon}</span>` +
          `<span class="t">${translate(game.title)}</span><span class="d">${translate(game.description)}</span><span class="b"></span>`;
        box.appendChild(card);
        cards.push({ game, stats: card.querySelector(".b") });
      }
    }
    // najprv údaje z tohto zariadenia, potom spoločná tabuľka zo servera
    const lowerByGame = {};
    for (const { game } of cards) for (const variant of game.variants) lowerByGame[variant.key] = !!game.lower;
    const showStats = boards => { for (const { game, stats } of cards) stats.innerHTML = cardStatsHtml(game, boards); };
    Brain.loadBoards(lowerByGame, { online: false }).then(showStats);
    if (Brain.cloudOn()) Brain.loadBoards(lowerByGame).then(showStats, () => { /* bez spojenia ostanú údaje zo zariadenia */ });

    // Odkaz na domáci rozcestník len na lokálnom serveri.
    if (location.hostname === "localhost" || /^\d+\.\d+\.\d+\.\d+$/.test(location.hostname)) {
      document.getElementById("back").hidden = false;
    }

    // meno hráča je povinné; rekordy a séria na kartách sú jeho
    Brain.ensureUser(document.querySelector("header"));
    I18N.attach();
  </script>
</body>
</html>
